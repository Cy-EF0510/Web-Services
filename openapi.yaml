openapi: 3.0.3

info:
  title: Weeb Database API
  description: REST API for managing anime and manga records.
  version: 1.0.0

servers:
  - url: http://localhost/weeb_project/api.php
    description: Local development server

tags:
  - name: Anime
    description: Operations for anime records
  - name: Manga
    description: Operations for manga records

paths:
  /anime:
    get:
      tags:
        - Anime
      summary: Get all anime
      operationId: getAnimeList
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of anime records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anime"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

    post:
      tags:
        - Anime
      summary: Create an anime record
      operationId: createAnime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimeInput"
      responses:
        "201":
          description: Anime record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anime"
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"

  /anime/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"

    get:
      tags:
        - Anime
      summary: Get an anime by ID
      operationId: getAnimeById
      responses:
        "200":
          description: Anime record found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anime"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

    put:
      tags:
        - Anime
      summary: Replace an anime record
      operationId: replaceAnime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimeInput"
      responses:
        "200":
          description: Anime record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anime"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    patch:
      tags:
        - Anime
      summary: Partially update an anime record
      operationId: updateAnime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimeUpdate"
      responses:
        "200":
          description: Anime record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anime"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags:
        - Anime
      summary: Delete an anime record
      operationId: deleteAnime
      responses:
        "200":
          description: Anime record deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /manga:
    get:
      tags:
        - Manga
      summary: Get all manga
      operationId: getMangaList
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of manga records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

    post:
      tags:
        - Manga
      summary: Create a manga record
      operationId: createManga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangaInput"
      responses:
        "201":
          description: Manga record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manga"
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"

  /manga/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"

    get:
      tags:
        - Manga
      summary: Get a manga by ID
      operationId: getMangaById
      responses:
        "200":
          description: Manga record found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manga"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

    put:
      tags:
        - Manga
      summary: Replace a manga record
      operationId: replaceManga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangaInput"
      responses:
        "200":
          description: Manga record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manga"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    patch:
      tags:
        - Manga
      summary: Partially update a manga record
      operationId: updateManga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangaUpdate"
      responses:
        "200":
          description: Manga record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manga"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags:
        - Manga
      summary: Delete a manga record
      operationId: deleteManga
      responses:
        "200":
          description: Manga record deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: Numeric ID of the record
      schema:
        type: integer
        minimum: 1

    Page:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Anime:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Fullmetal Alchemist
        season_aired:
          type: string
          nullable: true
          example: Spring
        year_aired:
          type: integer
          nullable: true
          example: 2009
        number_of_episodes:
          type: integer
          nullable: true
          example: 64
        number_of_seasons:
          type: integer
          nullable: true
          example: 1
        studio:
          type: string
          nullable: true
          example: Bones
        genre:
          type: string
          nullable: true
          example: Action, Fantasy
        status:
          type: string
          nullable: true
          example: Completed
      required:
        - id
        - title

    AnimeInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          example: Fullmetal Alchemist
        season_aired:
          type: string
          nullable: true
        year_aired:
          type: integer
          nullable: true
        number_of_episodes:
          type: integer
          minimum: 0
          nullable: true
        number_of_seasons:
          type: integer
          minimum: 0
          nullable: true
        studio:
          type: string
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    AnimeUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        season_aired:
          type: string
          nullable: true
        year_aired:
          type: integer
          nullable: true
        number_of_episodes:
          type: integer
          minimum: 0
          nullable: true
        number_of_seasons:
          type: integer
          minimum: 0
          nullable: true
        studio:
          type: string
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    Manga:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: One Piece
        author:
          type: string
          nullable: true
          example: Eiichiro Oda
        year_published:
          type: integer
          nullable: true
          example: 1997
        number_of_volumes:
          type: integer
          nullable: true
          example: 110
        number_of_chapters:
          type: integer
          nullable: true
          example: 1120
        genre:
          type: string
          nullable: true
          example: Adventure
        status:
          type: string
          nullable: true
          example: Ongoing
      required:
        - id
        - title

    MangaInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          example: One Piece
        author:
          type: string
          nullable: true
        year_published:
          type: integer
          nullable: true
        number_of_volumes:
          type: integer
          minimum: 0
          nullable: true
        number_of_chapters:
          type: integer
          minimum: 0
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    MangaUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          nullable: true
        year_published:
          type: integer
          nullable: true
        number_of_volumes:
          type: integer
          minimum: 0
          nullable: true
        number_of_chapters:
          type: integer
          minimum: 0
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string
          example: Endpoint not found
      required:
        - error

  responses:
    BadRequest:
      description: Invalid request or input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: Record or endpoint not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotAcceptable:
      description: The Accept header does not allow application/json
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnsupportedMediaType:
      description: Content-Type must be application/json on requests with a body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnprocessableEntity:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ServerError:
      description: Internal server or database error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
